
services:
  ttp:
    build:
      context: .
      target: ttp_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
    container_name: ttp
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    ports:
      - "5679:5679"  # Python debugger port for ttp
      - "5900:5900"  # VNC port
      - "6080:6080"  # Web VNC port
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    working_dir: /app
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:99}
    networks:
      - uttp_net

  ros:
    build:
      context: .
      target: ros_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
    container_name: ros
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    ports:
      - "5680:5679"  # Python debugger port for ros
      - "5901:5900"  # VNC port for ros
      - "6081:6080"  # Web VNC port for ros
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    working_dir: /app
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:99}
    networks:
      - uttp_net

networks:
  uttp_net:
    driver: bridge
