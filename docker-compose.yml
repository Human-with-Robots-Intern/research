
services:
  ttp:
    build:
      context: .
      target: ttp_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
        - PYTORCH_INDEX_URL=${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ttp
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "5679:5679"  # Python debugger port for ttp
      - "5901:5900"  # VNC port
      - "6080:6080"  # Web VNC port
    stdin_open: true
    tty: true
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      # - VK_ICD_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json 원래는 여긴데 권한문제와 덮어쓰기 문제로 아래로 변경
      - VK_ICD_FILENAMES=/opt/egl_vendor.d/10_nvidia.json
      # - DISPLAY=${DISPLAY:-:99}
      # HTTP bridge endpoint 
      - ROS_BRIDGE_URL=${ROS_BRIDGE_URL:-http://ros:8000}
      # Hugging Face Cache
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface

    networks:
      - uttp_net

 

  ros:
    build:
      context: .
      target: ros_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
    container_name: ros
    network_mode: host
    privileged: true
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/dri:/dev/dri
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # 디스플레이 소켓 마운트
      - /dev:/dev  # 시리얼 포트 접근을 위해 /dev 전체 마운트
    stdin_open: true
    tty: true
    command: ["./scripts/run_with_ros_env.sh", "uvicorn", "ttp_client.ros_bridge_server:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/src:/app/ros/ttp_ws/ttp_client
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # - ROS_DOMAIN_ID=0
      # - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eno1</NetworkInterfaceAddress></General></Domain></CycloneDDS>
      # - DISPLAY=${DISPLAY}

networks:
  uttp_net:
    driver: bridge

