
services:
  ttp:
    build:
      context: .
      target: ttp_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
    container_name: ttp
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
      - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "5679:5679"  # Python debugger port for ttp
      - "5901:5900"  # VNC port
      - "6080:6080"  # Web VNC port
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    working_dir: /app
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
      # HTTP bridge endpoint 
      - ROS_BRIDGE_URL=${ROS_BRIDGE_URL:-http://ros:8000}
    # depends_on:
    #   ros:
    #     condition: service_healthy
    networks:
      - uttp_net

 

  ros:
    build:
      context: .
      target: ros_development
      args:
        - UID=${UID}
        - GID=${GID}
        - USERNAME=${USERNAME}
    container_name: ros
    network_mode: host
    privileged: true
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/dri:/dev/dri
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # 디스플레이 소켓 마운트
      - /dev:/dev  # 시리얼 포트 접근을 위해 /dev 전체 마운트
    stdin_open: true
    tty: true
    command: ["./scripts/run_with_ros_env.sh", "uvicorn", "ttp_client.ros_bridge_server:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/src:/app/ros/ttp_ws/ttp_client
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # - ROS_DOMAIN_ID=0
      # - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eno1</NetworkInterfaceAddress></General></Domain></CycloneDDS>
      # - DISPLAY=${DISPLAY}

networks:
  uttp_net:
    driver: bridge

