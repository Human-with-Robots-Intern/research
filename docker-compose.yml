
services:
  uttp:
    build:
      context: .
      target: development
    container_name: uttp
    volumes:
      - .:/app
      # Vulkan ICD 디렉터리는 NVIDIA CDI가 주입하므로 별도 마운트하지 않음
    devices:
      - /dev/dri:/dev/dri #/dev/dri가 노출되어 있어야 Vulkan이 DRM 디바이스를 통해 GPU를 식별합니다.
    ports:
      - "5679:5679"  # Python debugger port
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    working_dir: /app
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # ICD 강제 지정은 제거 (로더가 자동 탐색)
