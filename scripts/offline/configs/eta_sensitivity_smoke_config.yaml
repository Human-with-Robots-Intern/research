# Minimal offline batch: 3 init priors × 3 etas × 1 scene × 1 case × 1 instruction.
# Use to verify meta_data.eta / init_prior_config and runtime behavior after harness overrides.
max_workers: 2
skip_completed: false
timeout_seconds: 600
suite_name: "eta_sensitivity_smoke"

approaches: ["bayesian"]
ablation_configs: [DEFAULT]
init_prior_configs:
  - UNDER_ESTIMATE
  - CORRECT_ESTIMATE
  - OVER_ESTIMATE

beam_bound:
  - [10, 10]
etas:
  - 0.01
  - 0.1
  - 0.9

gt_distribution: "constant"
belief_update_method: "bayesian"
gt_seed: 42

scene_type: [kitchen]
scene_lists:
  kitchen:
    - "FloorPlan1"

cases:
  - "tasks_2_constraints_1"

task_folder_name:
  - "sampled_10_instruction_set_for_final_experiment_251203"
max_tasks: 1

output_dir: "assets/results/offline_exp_result/offline_batch_eta_sensitivity_smoke"
oracle_reference_dir: "assets/results/offline_oracle_reference"
