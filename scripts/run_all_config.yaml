#Configuration for run_all.py
simulation: true # 시뮬레이션 실험인지 실물실험인지를 가르는 인자. 
cloud_rendering: false # 백그라운드 실행용. 화면을 보려면 false

num_runs_per_instruction: 1 #반복 시행 횟수
max_retries: 1 # set to be 1
retry_delay_seconds: 2 # Delay in seconds between retries
max_workers: 1 # 병렬실행 수
instruction_delay_seconds: 0 # 각 실행 별 delay
# Logging configuration
log_level: "DEBUG" # Log level for the script. Options: 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'
start_idx: 1 # 시작하는 task의 번호
# Execution settings

# 실행하고자 하는 방법론리스트, 실행하지 않으려면 주석처리
approaches:
  - "src/baselines/cpm.py"
  - "src/baselines/edf/dag_edf.py"
  - "src/dag_bayesian.py"
# Scripts that use LLMs and are subject to retries on failure
llm_scripts:
  # - "src/baselines/progprompt/prog_ai2thor.py"
  # - "src/baselines/cap/cap_ai2thor.py"
# Scene lists for each scene type
scene_type: # Default scene type to run. Options: 'kitchen', 'bathroom'
  - kitchen
  # - bathroom
  # - real_world
scene_lists:
  kitchen:
    - "FloorPlan1"
    - "FloorPlan7"
    - "FloorPlan13"
    - "FloorPlan18"
    - "FloorPlan27"
  bathroom:
    # - "FloorPlan419"
    # - "FloorPlan422"
    # - "FloorPlan426"
    # - "FloorPlan427"
  real_world:
    # - "FloorPlan301"
ablation_configs:
  - DEFAULT
  - NONE_MONITORING
init_prior_configs: #초기 시간 값 종류
  - CORRECT_ESTIMATE
  - OVER_ESTIMATE
  - UNDER_ESTIMATE
  - OVER_MEDIUM_ESTIMATE
  - UNDER_MEDIUM_ESTIMATE
# ------------------------------------------------------------------------------
# Task Filtering
# ------------------------------------------------------------------------------
task_folder_name: "sampled_10_instruction_set_for_final_experiment_251203" # Folder under assets/tasks/
min_task_count: 0
min_constraint_count: 0
skip_completed: true
# ==============================================================================
# Ablation Study Configurations
# ==============================================================================