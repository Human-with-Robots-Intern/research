[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "A research project using OmniGibson and PyTorch."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "numpy>=1.23.5,<2.0.0",
    "scipy>=1.10.1",
    "matplotlib>=3.0.0",
    "networkx~=3.2.1",
    "pyyaml~=6.0.1",
    "gymnasium>=0.28.1",
    "opencv-python",
    "omnigibson @ file://path/to/omnigibson",
    "torch",
    "torchvision",
    "torchaudio",
    "trimesh~=4.0.8",
    "rtree~=1.2.0",
    "cryptography",
    "GitPython~=3.1.40",
    "transforms3d~=0.4.1",
    "addict~=2.4.0",
    "ipython~=8.20.0",
    "future~=0.18.3",
    "termcolor~=2.4.0",
    "pymeshlab~=2022.2",
    "graphviz~=0.20",
    "bddl~=3.5.0",
    "nest_asyncio~=1.5.8",
    "imageio~=2.33.1",
    "imageio-ffmpeg~=0.4.9",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "pyright",
    "pytest",
    "coverage",
]

[tool.black]
line-length = 120
target-version = ["py310"]
force-exclude = "omnigibson/(data|external)"

[tool.isort]
profile = "black"
line_length = 120
py_version = "310"
filter_files = true
extend_skip_glob = [
    "omnigibson/data/*",
    "omnigibson/external/*",
]

[tool.pyright]
exclude = [
    "omnigibson/data",
    "omnigibson/docs",
    "omnigibson/docker",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = ["omnigibson/external/*"]
