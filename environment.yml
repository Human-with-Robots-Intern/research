name: research
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Core Python and frequently used libraries
  - python=3.10.15
  - numpy>=1.23.5,<2.0.0
  - scipy>=1.10.1
  - matplotlib>=3.0.0
  - networkx~=3.2.1
  - pyyaml~=6.0.1

  # PyTorch and GPU dependencies
  - pytorch
  - torchvision
  - torchaudio

  # Simulation and robotics libraries
  - gymnasium>=0.28.1
  - opencv
  - omnigibson

  # Other utilities and libraries
  - h5py
  - trimesh
  - rtree
  - cryptography
  - progressbar
  - click

  # Developer tools
  - pip
  - pip:
      - black
      - isort
      - pyright
      - pytest
      - coverage
      - GitPython~=3.1.40
      - transforms3d~=0.4.1
      - addict~=2.4.0
      - ipython~=8.20.0
      - future~=0.18.3
      - termcolor~=2.4.0
      - pymeshlab~=2022.2
      - graphviz~=0.20
      - bddl~=3.5.0
      - nest_asyncio~=1.5.8
      - imageio~=2.33.1
      - imageio-ffmpeg~=0.4.9
